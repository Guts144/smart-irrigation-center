services:
  postgres:
    image: postgres:16-alpine
    container_name: aquasense-postgres
    environment:
      POSTGRES_DB: aquasense
      POSTGRES_USER: aquasense
      POSTGRES_PASSWORD: aquasense
    ports:
      - "5432:5432"
    volumes:
      - aquasense_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasense -d aquasense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aquasense_pg_data:
